[config]

[templates.waybar]
input_path = "~/.config/matugen/templates/colors.css"
output_path = "~/.config/waybar/colors.css"
# post_hook = "pkill -SIGUSR2 waybar"


[templates.rofi]
input_path = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"


[templates.waybar-clock]
input_path = "~/.config/matugen/templates/waybar-clock.json"
output_path = "~/.config/waybar/waybar-clock.json"

[templates.alacritty]
input_path = '~/.config/matugen/templates/alacritty.toml'
output_path = '~/.config/alacritty/colors.toml'

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland.lua"
output_path = "~/.config/hypr/matugen-colors.lua"

[templates.colors-sh]
input_path = "~/.config/matugen/templates/colors.sh"
output_path = "~/.config/matugen/generated/colors.sh"

[templates.polybar]
input_path = "~/.config/matugen/templates/polybar-colors.ini"
output_path = "~/.config/polybar/colors.ini"

[templates.xmonad]
input_path = "~/.config/matugen/templates/xmonad-colors.hs"
output_path = "~/.config/xmonad/lib/Colors/Wallpaper.hs"
# post_hook = "~/.config/matugen/update-xmonad.sh"

[templates.quickshell]
input_path = "~/.config/matugen/templates/quickshell-colors.json"
output_path = "~/.config/quickshell/Theme/colors.json"

[templates.niri]
input_path = "~/.config/matugen/templates/niri-colors.kdl"
output_path = "~/.config/niri/matugen-colors.kdl"
